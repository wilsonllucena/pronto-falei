name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, testes, build e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar .env descartável (valores aleatórios, só pro CI)
        run: |
          {
            echo "NEXT_PUBLIC_SERVER_URL=http://localhost:3130"
            echo "PAYLOAD_SECRET=$(openssl rand -hex 32)"
            echo "DATABASE_URI=mongodb://127.0.0.1:27017/pronto_falei?replicaSet=rs0&directConnection=true"
            echo "MINIO_ROOT_USER=ci$(openssl rand -hex 4)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_ENDPOINT=http://127.0.0.1:3131"
            echo "S3_BUCKET=pronto-falei-media"
            echo "S3_REGION=us-east-1"
            echo "S3_FORCE_PATH_STYLE=true"
            echo "S3_ACCESS_KEY_ID=ciapp$(openssl rand -hex 4)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 20)"
            echo "MEDIA_PUBLIC_URL=http://localhost:3131/pronto-falei-media"
            echo "CANONICAL_REDIRECT_HOSTS=www.pronto-falei.test"
            echo "REMARK_SITE_ID=pronto-falei"
            echo "NEWSLETTER_SMTP_HOST=mailpit"
            echo "NEWSLETTER_SMTP_PORT=1025"
            echo "TZ=America/Sao_Paulo"
          } > .env
          echo "E2E_REDIRECT_HOST=www.pronto-falei.test" >> "$GITHUB_ENV"
          echo "E2E_EMAIL=ci@pronto-falei.local" >> "$GITHUB_ENV"
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "E2E_COMMENTS=1" >> "$GITHUB_ENV"
          echo "E2E_NEWSLETTER=1" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Produção — compose válido e scripts de deploy/backup (shellcheck)
        run: |
          env_file="$(mktemp)"
          for v in NEXT_PUBLIC_SERVER_URL PAYLOAD_SECRET MONGO_ROOT_USER MONGO_ROOT_PASSWORD \
            MONGO_KEYFILE MONGO_APP_USER MONGO_APP_PASSWORD MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
            S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY PG_PASSWORD UMAMI_DB_PASSWORD UMAMI_APP_SECRET \
            REMARK_SECRET REMARK_ADMIN_PASSWD LISTMONK_DB_PASSWORD LISTMONK_ADMIN_PASSWORD; do echo "$v=ci-placeholder" >> "$env_file"; done
          docker compose -f docker-compose.prod.yml --env-file "$env_file" --profile ia config -q
          shellcheck -S warning scripts/*.sh backup/*.sh llm/*.sh pg/init/*.sh pg/*.sh
          python3 -m py_compile scripts/setup-umami.py scripts/setup-listmonk.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Subir Mongo (replica set) e MinIO (bucket + usuário do app)
        run: |
          docker compose up -d --wait mongo minio
          docker compose run --rm minio-init

      - name: Testes de integração (Payload + Mongo + MinIO)
        run: pnpm test:int

      - name: Smoke test — subir a stack com a imagem de produção (+ mock da IA, Umami, Remark42, Listmonk e Mailpit)
        env:
          COMPOSE_PROFILES: mock,stats,comentarios,newsletter
        run: |
          docker compose up -d --build --wait
          python3 scripts/setup-umami.py --url http://127.0.0.1:3133 --env-file .env \
            --secret-file "$RUNNER_TEMP/umami.txt" --domain localhost
          python3 scripts/setup-listmonk.py --url http://127.0.0.1:3135 --env-file .env
          docker compose up -d --wait app
          echo "E2E_UMAMI_URL=http://127.0.0.1:3133" >> "$GITHUB_ENV"
          echo "E2E_UMAMI_SECRET_FILE=$RUNNER_TEMP/umami.txt" >> "$GITHUB_ENV"

      - name: Smoke test — Playwright (site, post, preview, busca, páginas, leitura por IA, síntese com IA mockada, séries, /api/health, admin, mídia, CSRF, analytics, comentários, newsletter)
        env:
          E2E_LLM: mock
        run: |
          pnpm exec playwright install --with-deps chromium
          mkdir -p smoke-shots
          SHOTS_DIR="$PWD/smoke-shots" pnpm test:e2e

      - name: Logs dos containers
        if: failure()
        run: docker compose --profile mock --profile stats --profile comentarios --profile newsletter logs --no-color --tail=200

      - name: Prints do smoke test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-shots
          path: |
            smoke-shots/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Derrubar a stack
        if: always()
        run: docker compose --profile mock --profile stats --profile comentarios --profile newsletter down -v
