# Compose de DESENVOLVIMENTO (passo 1). Produção no Umbrel (auth no Mongo com
# keyfile, backup, portas na LAN): docker-compose.prod.yml (passo 10).
#
#   cp .env.example .env   # e preencha os valores (veja o README)
#   docker compose up -d --build
#
# IA local da síntese (passo 8), escolha um perfil:
#   COMPOSE_PROFILES=ia   → llama.cpp + Qwen3-4B (baixa ~2,1 GB uma vez pro volume)
#   COMPOSE_PROFILES=mock → mock do llm (CI e testes, sem modelo)
# Sem perfil, o botão "Gerar síntese" responde com erro e oferece o resumo extrativo.
#
name: pronto-falei-dev

services:
  app:
    build: .
    image: pronto-falei-app:dev
    ports: ['127.0.0.1:${APP_PORT:-3130}:3000']
    environment:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3130}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?defina PAYLOAD_SECRET no .env}
      DATABASE_URI: mongodb://mongo:27017/pronto_falei?replicaSet=rs0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-pronto-falei-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID no .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no .env}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:3131/pronto-falei-media}
      LLM_BASE_URL: http://llm:8080/v1
      LLM_MODEL_FILE: ${LLM_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q3_K_M.gguf}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-360000}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-3800}
      CANONICAL_REDIRECT_HOSTS: ${CANONICAL_REDIRECT_HOSTS:-}
      PAYLOAD_ALLOWED_ORIGINS: ${PAYLOAD_ALLOWED_ORIGINS:-}
      # Analytics (perfil stats): sem UMAMI_WEBSITE_ID o tracker não entra na página.
      UMAMI_INTERNAL_URL: ${UMAMI_INTERNAL_URL:-http://umami:3000}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_DOMAINS: ${UMAMI_DOMAINS:-}
      UMAMI_RESPECT_DNT: ${UMAMI_RESPECT_DNT:-true}
      # Comentários (perfil comentarios): sem REMARK_SITE_ID o widget não aparece.
      REMARK_INTERNAL_URL: ${REMARK_INTERNAL_URL:-http://remark42:8080}
      REMARK_SITE_ID: ${REMARK_SITE_ID:-}
      REMARK_ADMIN_PASSWD: ${REMARK_ADMIN_PASSWD:-remark-dev-admin}
      # Newsletter (perfil newsletter): formulário só com SMTP configurado
      LISTMONK_INTERNAL_URL: ${LISTMONK_INTERNAL_URL:-http://listmonk:9000}
      LISTMONK_LIST_UUID: ${LISTMONK_LIST_UUID:-}
      NEWSLETTER_ENABLED: ${NEWSLETTER_SMTP_HOST:+true}
      TZ: ${TZ:-America/Sao_Paulo}
    networks: [default, internal]
    depends_on:
      mongo: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy: { resources: { limits: { memory: 768m, cpus: '1.5' } } }
    restart: unless-stopped

  mongo:
    image: mongo:8.0.38
    # Replica set de um nó (rs0): o Payload precisa dele pra usar transações.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    ports: ['127.0.0.1:${MONGO_PORT:-27017}:27017'] # só pra pnpm dev/testes no host
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Inicia o replica set na primeira subida e só fica saudável quando é primário.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    deploy: { resources: { limits: { memory: 768m } } }
    restart: unless-stopped

  minio:
    # Fork mantido do MinIO (o mesmo do RifaJá). Guarda as imagens do blog.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    ports: ['127.0.0.1:${MINIO_API_PORT:-3131}:9000', '127.0.0.1:${MINIO_CONSOLE_PORT:-3132}:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  minio-init:
    # Roda uma vez: bucket, leitura pública só em media/ e usuário restrito do app.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z # traz o cliente mcli
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ['/bin/sh', '/init/minio-init.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      S3_BUCKET: ${S3_BUCKET:-pronto-falei-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID no .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no .env}
    volumes: ['./minio/init:/init:ro']
    restart: 'no'

  # ---------------- IA local da síntese (passo 8) ----------------

  llm-model:
    # Roda uma vez: baixa o GGUF pro volume e confere o SHA-256 (pula se já tem).
    profiles: [ia]
    image: curlimages/curl:8.23.0
    user: '0:0' # grava no volume
    entrypoint: ['/bin/sh', '/init/fetch-model.sh']
    environment:
      MODEL_URL: ${LLM_MODEL_URL:-https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q3_K_M.gguf}
      MODEL_SHA256: ${LLM_MODEL_SHA256:-9c6e0763577125a994a9bea0bbd7a737ac4498b8a6a4e0f788727553af1806c9}
      MODEL_FILE: ${LLM_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q3_K_M.gguf}
    volumes: [llm-models:/models, ./llm:/init:ro]
    networks: [default] # precisa de internet só pra baixar
    restart: 'no'

  llm:
    # llama.cpp server, só CPU e só texto. Sem porta no host e sem saída pra
    # internet (rede internal). Dorme depois de 2 min parado (libera a RAM).
    profiles: [ia]
    image: ghcr.io/ggml-org/llama.cpp:server-b12627
    depends_on:
      llm-model: { condition: service_completed_successfully }
    command: >
      -m /models/${LLM_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q3_K_M.gguf}
      --host 0.0.0.0 --port 8080
      -t 3 -tb 3 -c 5120 -np 1
      --reasoning off --no-repack --cache-ram 0
      --sleep-idle-seconds 120
    volumes: [llm-models:/models:ro]
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy: { resources: { limits: { memory: 3g, cpus: '3' } } }
    networks: [internal]
    restart: unless-stopped

  llm-mock:
    # Mesma API do llama.cpp, sem modelo: CI e testes de ponta a ponta.
    profiles: [mock]
    image: node:24.22.3-alpine
    command: ['node', '/mock/server.mjs']
    volumes: ['./llm/mock:/mock:ro']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 128m } } }
    networks:
      internal: { aliases: [llm] }
    restart: unless-stopped

  # ---------- Analytics (perfil stats): Postgres + Umami, painel em 127.0.0.1:3133 ----------
  # Senhas de DEV (só localhost); em produção vêm do .env gerado no servidor.
  pg:
    profiles: [stats, newsletter]
    image: postgres:18.7
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pg-dev}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-umami-dev}
    volumes: [pg-data:/var/lib/postgresql, './pg/init:/docker-entrypoint-initdb.d:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d umami']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  umami:
    profiles: [stats]
    image: ghcr.io/umami-software/umami:3.5.0
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami-dev}@pg:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-umami-dev-secret}
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
    ports: ['127.0.0.1:${UMAMI_PORT:-3133}:3000']
    depends_on:
      pg: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal, default]
    restart: unless-stopped

  # ---------- Comentários (perfil comentarios): Remark42 em /comentarios pelo app ----------
  remark42:
    profiles: [comentarios]
    image: umputun/remark42:v1.18.0
    environment:
      REMARK_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3130}/comentarios
      SECRET: ${REMARK_SECRET:-remark-dev-secret}
      SITE: ${REMARK_SITE_ID:-pronto-falei}
      ADMIN_PASSWD: ${REMARK_ADMIN_PASSWD:-remark-dev-admin}
      # Só comentário anônimo (nome, sem cadastro); sem OAuth nem e-mail.
      AUTH_ANON: 'true'
      # O app é o único proxy (rede interna); ele manda o IP real do visitante.
      TRUSTED_PROXY: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      MIN_COMMENT_SIZE: '3'
      MAX_COMMENT_SIZE: '2000'
      UPDATE_LIMIT: '0.2'
      VOTES_IP: 'true'
      # Anti-spam: palavras proibidas (comentário recusado), nomes reservados,
      # limite de envio por IP (UPDATE_LIMIT/s) e tamanho mínimo/máximo.
      RESTRICTED_WORDS: ${REMARK_RESTRICTED_WORDS:-casino,cassino,viagra,cialis,porn,porno,xxx,escort,bet365,forex,airdrop}
      RESTRICTED_NAMES: ${REMARK_RESTRICTED_NAMES:-admin,administrador,moderador,Wilson,Wilson Lima,wilsonlima,Pronto Falei}
      IMAGE_MAX_SIZE: '1000000'
      EDIT_TIME: 10m
      EMOJI: 'true'
      DISABLE_SIGNATURE: 'true'
      MAX_BACKUP_FILES: '7'
      TIME_ZONE: America/Sao_Paulo
    volumes: [remark42-data:/srv/var]
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:8080/ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  # ---------- Newsletter (perfil newsletter): Listmonk + Mailpit (SMTP de teste) ----------
  # Painel do Listmonk em 127.0.0.1:3135; caixa do Mailpit em 127.0.0.1:3134.
  listmonk-db:
    profiles: [newsletter]
    image: postgres:18.7
    entrypoint: ['bash', '/listmonk-db.sh']
    environment:
      PGHOST: pg
      PGUSER: postgres
      PGPASSWORD: ${PG_PASSWORD:-pg-dev}
      LISTMONK_DB_PASSWORD: ${LISTMONK_DB_PASSWORD:-listmonk-dev}
    volumes: ['./pg/listmonk-db.sh:/listmonk-db.sh:ro']
    depends_on:
      pg: { condition: service_healthy }
    networks: [internal]
    restart: 'no'

  listmonk:
    profiles: [newsletter]
    image: listmonk/listmonk:v6.2.0
    # instala (idempotente), migra e sobe; o admin vem do env só na instalação
    command:
      - sh
      - -c
      - ./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && exec ./listmonk --config ''
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: pg
      LISTMONK_db__port: '5432'
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-listmonk-dev}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-listmonk-dev-admin}
      TZ: ${TZ:-America/Sao_Paulo}
    ports: ['127.0.0.1:${LISTMONK_PORT:-3135}:9000']
    volumes: [listmonk-uploads:/listmonk/uploads]
    depends_on:
      listmonk-db: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal, default]
    restart: unless-stopped

  mailpit:
    profiles: [newsletter]
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:${MAILPIT_PORT:-3134}:8025']
    networks: [internal, default]
    restart: unless-stopped

networks:
  default: {}
  internal: { internal: true }


volumes:
  mongo-data: {}
  minio-data: {}
  llm-models: {}
  pg-data: {}
  remark42-data: {}
  listmonk-uploads: {}
